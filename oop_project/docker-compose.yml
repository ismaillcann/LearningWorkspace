
services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=sales_data
      - INFLUXDB_ADMIN_USER=can.ismail
      - INFLUXDB_ADMIN_PASSWORD=ismailcan.3125
    volumes:
      - influxdb-data:/var/lib/influxdb

  app:
    build:
      context: .
    container_name: python_app
    depends_on:
      - influxdb
    volumes:
      - .:/app
    environment:
      - INFLUXDB_URL=https://us-east-1-1.aws.cloud2.influxdata.com
      - INFLUXDB_TOKEN=RedDVCLKEOhTjtYYqTIYaJYgxpPwJwRsRGVqlxe0cdSJVEVDXL4SzGCYRxfgZ6COGVkzWF3EAs8Fxvxt5YBLHw==
      - INFLUXDB_ORG=can.ismail
      - INFLUXDB_BUCKET=sales_bucket
    command: ["python", "influxdb_handler.py"]

volumes:
    influxdb-data:
