
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"

  app:
    build:
      context: .
    container_name: python_app
    depends_on:
      - redis
      - mongodb
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongodb:27017/
    command: ["python", "listener.py"]
